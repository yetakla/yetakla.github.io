<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yetakla — o'yin orqali o'rganing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Yangi kasb va ko'nikmalarni o'zbek tilida, o'yin orqali o'rganing. Birinchi yo'nalish: data analitika">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: phone-first single column (max 560px), sticky stat bar on top, tab bar at bottom; lessons open as a full-screen layer. */
:root {
  --bg: #f2f7f1; --surface: #ffffff; --surface-2: #e8f0e7; --ink: #16301e; --muted: #5b7062; --line: #d5e2d4;
  --green: #1f9d55; --green-d: #157a40; --green-soft: #d9f3e2;
  --sun: #f5a400; --sun-soft: #fff1cc; --flame: #f26a1b; --heart: #e5484d; --heart-soft: #fde2e2;
  --sky: #2f6fdb; --sky-soft: #dde8fb; --lock: #c3cfc4; --lock-d: #a7b5a9;
  --code-bg: #10261a; --code-ink: #d7f5df; --kw: #7ee0a1; --str: #ffd27a; --num: #9cc4ff; --fn: #7ee0a1;
  --mascot-head: #1f9d55; --mascot-screen: #0d2416; --mascot-eye: #8cf5b0;
  --shadow: 0 1px 0 rgba(22, 48, 30, .06), 0 8px 24px -12px rgba(22, 48, 30, .25);
  --f-display: "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
  --f-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1812; --surface: #16241b; --surface-2: #1d2f23; --ink: #e4f2e7; --muted: #9bb3a2; --line: #2a3f31;
    --green: #33c46f; --green-d: #1f9d55; --green-soft: #173a25;
    --sun: #ffbd2e; --sun-soft: #3a2f12; --flame: #ff8a3d; --heart: #ff6b6f; --heart-soft: #3d1c1e;
    --sky: #6c9cf0; --sky-soft: #1b2a45; --lock: #34473a; --lock-d: #27362c;
    --code-bg: #08140d; --mascot-head: #2fb766; --mascot-screen: #07150d;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1812; --surface: #16241b; --surface-2: #1d2f23; --ink: #e4f2e7; --muted: #9bb3a2; --line: #2a3f31;
  --green: #33c46f; --green-d: #1f9d55; --green-soft: #173a25;
  --sun: #ffbd2e; --sun-soft: #3a2f12; --flame: #ff8a3d; --heart: #ff6b6f; --heart-soft: #3d1c1e;
  --sky: #6c9cf0; --sky-soft: #1b2a45; --lock: #34473a; --lock-d: #27362c;
  --code-bg: #08140d; --mascot-head: #2fb766; --mascot-screen: #07150d;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
code, pre, textarea, input, .code, .mono, .fx, .fxhelp, .schema { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top stats */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--green); margin-right: auto; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.brand small { font-size: 11px; color: var(--muted); font-family: var(--f-body); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.stat { display: inline-flex; align-items: center; white-space: nowrap; flex: none; gap: 4px; font-weight: 800; font-size: 15px; padding: 6px 8px; border-radius: 12px; font-variant-numeric: tabular-nums; }
.stat.fire { color: var(--flame); } .stat.fire.off { color: var(--muted); filter: grayscale(1); }
.stat.xp { color: var(--sun); } .stat.hp { color: var(--heart); }
@media (max-width: 390px) { .topbar .wrap { gap: 2px; } .brand { font-size: 19px; } .stat { padding: 6px 4px; font-size: 14px; } }
.ring { width: 34px; height: 34px; position: relative; flex: none; }
.ring svg { width: 34px; height: 34px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 900; color: var(--muted); }

/* Bottom nav */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 12px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--green); }

/* Map */
.map { padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.practice-cta { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; }
.practice-cta p { margin: 0; font-size: 14px; color: var(--muted); flex: 1; min-width: 0; }
.practice-cta p b { color: var(--ink); display: block; font-size: 15px; }
.banner { border-radius: var(--r); padding: 16px 18px; color: #fff; display: flex; gap: 12px; align-items: center; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18); }
.banner .t { flex: 1; min-width: 0; }
.banner .eyebrow { font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.banner h2 { font-size: 24px; margin-top: 2px; }
.banner p { margin: 4px 0 0; font-size: 14px; opacity: .92; }
.banner .pill { flex: none; background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 900; white-space: nowrap; }
.banner.locked { background: var(--lock) !important; color: var(--muted); box-shadow: inset 0 -4px 0 var(--lock-d); }
.banner.locked .pill { background: var(--surface); }
.path { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 0 30px; position: relative; }
.nw { display: flex; flex-direction: column; align-items: center; }
.map { overflow-x: clip; }
.node-row { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; }
.node { --c: var(--green); --s: 72px; width: var(--s); height: var(--s); border-radius: 50%; position: relative; display: grid; place-items: center; background: var(--c); box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 70%, #000); transition: transform .12s; color: #fff; }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 70%, #000); }
.node svg { width: 34px; height: 34px; }
.node.locked { --c: var(--lock); color: var(--lock-d); box-shadow: 0 7px 0 var(--lock-d); }
.node.boss { --s: 84px; border-radius: 28px; }
.node.current::before { content: ""; position: absolute; top: -6.5px; left: -10px; width: calc(var(--s) + 20px); height: calc(var(--s) + 20px); box-sizing: border-box; border-radius: 50%; border: 5px solid color-mix(in srgb, var(--c) 35%, transparent); animation: pulse 1.8s ease-in-out infinite; }
.node.boss.current::before { border-radius: 34px; }
.bubble { position: relative; margin-bottom: 20px; background: var(--surface); color: var(--c); border: 2px solid var(--line); font-weight: 900; font-size: 13px; letter-spacing: .06em; padding: 7px 12px; border-radius: 12px; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
.bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--surface); }
.node-label { margin-top: 14px; font-size: 13px; font-weight: 800; color: var(--muted); max-width: 180px; text-align: center; line-height: 1.25; }
.node-label.on { color: var(--ink); }
.pop { position: relative; z-index: 3; margin-top: 12px; width: min(320px, 100%); background: var(--c); color: #fff; border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
.pop.locked { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.pop h3 { font-size: 19px; } .pop p { margin: 4px 0 12px; font-size: 14px; opacity: .92; }
.pop .btn { width: 100%; }
.side-mascot { position: absolute; width: 92px; pointer-events: none; }
.side-mascot.l { left: 2%; } .side-mascot.r { right: 2%; }
@media (max-width: 380px) { .side-mascot { display: none; } }

/* Buttons */
.btn { --b: var(--green); --bd: var(--green-d); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px; border-radius: 16px; font-weight: 900; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; background: var(--b); color: #fff; box-shadow: 0 5px 0 var(--bd); transition: transform .08s, box-shadow .08s; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--bd); }
.btn:disabled { --b: var(--lock); --bd: var(--lock-d); color: var(--muted); cursor: default; }
.btn.white { --b: #fff; --bd: rgba(0, 0, 0, .18); color: var(--c, var(--green)); }
.btn.ghost { --b: var(--surface); --bd: var(--line); color: var(--muted); border: 2px solid var(--line); }
.btn.red { --b: var(--heart); --bd: color-mix(in srgb, var(--heart) 70%, #000); }
.btn.sky { --b: var(--sky); --bd: color-mix(in srgb, var(--sky) 70%, #000); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 13px; border-radius: 12px; box-shadow: 0 3px 0 var(--bd); }
.linkbtn { font-weight: 800; color: var(--sky); padding: 8px 4px; font-size: 14px; }

/* Lesson layer */
.layer { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.layer > * { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
.lbar { display: flex; align-items: center; gap: 14px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.lbar .x { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.lbar .x svg { width: 22px; height: 22px; }
.prog { flex: 1; height: 16px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--green); border-radius: inherit; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); position: relative; }
.prog i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .35); }
.lbody { flex: 1; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.kind { font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kind .tag { background: var(--sun-soft); color: var(--sun); padding: 3px 8px; border-radius: 8px; }
.kind .tag.boss { background: var(--heart-soft); color: var(--heart); }
.q { font-family: var(--f-display); font-size: 23px; font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; }
.lfoot { border-top: 2px solid var(--line); padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 12px; align-items: center; }
.lfoot .btn.main { flex: 1; white-space: nowrap; }
.lfoot .btn.help { flex: none; text-transform: none; letter-spacing: 0; padding-inline: 14px; }

/* Feedback */
.fb { padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up .22s ease-out; display: flex; flex-direction: column; gap: 10px; }
.fb.good { background: var(--green-soft); color: var(--green-d); }
.fb.bad { background: var(--heart-soft); color: var(--heart); }
.fb.soft { background: var(--sky-soft); color: var(--sky); }
:root[data-theme="dark"] .fb.good { color: var(--green); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fb.good { color: var(--green); } }
.fb .head { display: flex; align-items: center; gap: 12px; }
.fb .head svg.mascot { width: 54px; height: 60px; flex: none; }
.fb h3 { font-size: 22px; }
.fb .txt { font-size: 15px; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.fb .txt b { color: inherit; }
.fb .ans { font-weight: 800; }
.fb .ans code { font-family: var(--f-mono); font-size: 14px; background: var(--surface); padding: 2px 6px; border-radius: 6px; color: var(--ink); word-break: break-word; }
.fb .use { font-size: 14px; color: var(--muted); }
.fb .btn { width: 100%; }
.fb.bad .btn { --b: var(--heart); --bd: color-mix(in srgb, var(--heart) 70%, #000); }
.fb.soft .btn { --b: var(--sky); --bd: color-mix(in srgb, var(--sky) 70%, #000); }

/* Theory */
.theory { display: flex; flex-direction: column; gap: 14px; }
.theory h2 { font-size: 28px; }
.say { display: flex; gap: 10px; align-items: flex-end; }
.say svg.mascot { width: 64px; height: 72px; flex: none; }
.say .sb { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-weight: 700; flex: 1; min-width: 0; }
.say .sb::before { content: ""; position: absolute; left: -9px; bottom: 16px; width: 14px; height: 14px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.theory .body { font-size: 17px; margin: 0; }
.theory .ex { font-size: 14px; color: var(--muted); border-left: 4px solid var(--sun); padding: 2px 0 2px 10px; margin: 0; }

/* Visuals */
.tblwrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; background: var(--surface-2); font-weight: 800; color: var(--muted); font-size: 12px; letter-spacing: .03em; padding: 8px 10px; white-space: nowrap; }
table.t td { padding: 7px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
table.t tr.hl td { background: var(--sun-soft); }
.sheetwrap { overflow-x: auto; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); }
table.sheet { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 100%; }
table.sheet th { background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 11px; padding: 3px 8px; border: 1px solid var(--line); text-align: center; }
table.sheet td { border: 1px solid var(--line); padding: 5px 8px; white-space: nowrap; min-width: 48px; }
table.sheet tr.h td { font-weight: 800; background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
table.sheet td.n { text-align: right; }
table.sheet td.hl { background: var(--sun-soft); box-shadow: inset 0 0 0 1px var(--sun); }
table.sheet td.tg { background: var(--sky-soft); box-shadow: inset 0 0 0 2px var(--sky); font-weight: 800; color: var(--sky); }
table.sheet td.tg.err { color: var(--heart); box-shadow: inset 0 0 0 2px var(--heart); background: var(--heart-soft); }
.fx { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.fx em { font-style: italic; font-weight: 700; color: var(--muted); font-family: var(--f-body); }
.fx .cell { font-weight: 800; color: var(--sky); }
.code { background: var(--code-bg); color: var(--code-ink); font-family: var(--f-mono); font-size: 15px; padding: 14px 16px; border-radius: 12px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; line-height: 1.5; }
.code .kw { color: var(--kw); font-weight: 700; } .code .str { color: var(--str); } .code .nm { color: var(--num); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px; font-weight: 800; font-size: 14px; }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cycle .chip { background: var(--green-soft); border-color: transparent; color: var(--green-d); }
:root[data-theme="dark"] .cycle .chip { color: var(--green); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cycle .chip { color: var(--green); } }
.cycle .arr { color: var(--muted); font-weight: 900; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 170px; padding: 12px 12px 0; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 46px; background: var(--green); border-radius: 8px 8px 0 0; }
.bars .b span { font-size: 12px; font-weight: 800; color: var(--muted); padding: 6px 0 8px; }
.bars .b small { font-size: 12px; font-weight: 800; padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.bars-unit { font-size: 12px; color: var(--muted); margin-top: -8px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kpi span { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.kpi b { display: block; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--green); font-weight: 800; }
.pivot { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.pivot .arrow { font-weight: 900; color: var(--muted); font-size: 22px; }
.pivot.wide { grid-template-columns: minmax(0, 1fr); justify-items: stretch; }
.pivot.wide .arrow { transform: rotate(90deg); justify-self: center; line-height: 1; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chartcard { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 14px; }
.chartcard svg { width: 100%; max-width: 130px; height: auto; }

/* Options */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; padding: 13px 14px; font-weight: 700; font-size: 16px; display: flex; gap: 12px; align-items: center; transition: transform .06s; }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 900; color: var(--muted); }
.opt.sel { border-color: var(--sky); background: var(--sky-soft); color: var(--sky); }
.opt.sel .k { border-color: var(--sky); color: var(--sky); }
.opt:disabled { cursor: default; }
.opt:active:not(:disabled) { transform: translateY(2px); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { justify-content: center; font-size: 18px; padding: 18px 10px; }
.statement { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 700; }
.context { background: var(--sun-soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.context b { font-family: var(--f-display); font-size: 17px; }

.slot { display: inline-flex; min-width: 70px; height: 38px; vertical-align: middle; border-bottom: 3px solid var(--muted); margin: 0 4px; align-items: center; justify-content: center; }

.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.bugline .blk.sel { border-color: var(--heart); background: var(--heart-soft); color: var(--heart); }
.chartopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chartopts .opt { flex-direction: column; justify-content: center; text-align: center; gap: 6px; padding: 12px; }

/* Live SQL & formula */
.editor { width: 100%; min-height: 110px; resize: vertical; background: var(--code-bg); color: var(--code-ink); border: 2px solid transparent; border-radius: 12px; padding: 12px 14px; font-family: var(--f-mono); font-size: 16px; line-height: 1.5; }

.task { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 17px; }
.fxinput { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 12px; }

.sheet-modal .card { width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; max-height: 85vh; overflow-y: auto; }

/* Badges & profile */
.page { padding-top: 18px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 16px; }

.page h3 { font-size: 18px; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 14px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }

.badge.off .ic { background: var(--lock); color: var(--lock-d); box-shadow: none; }
.badge.off b { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stats .card b { display: block; font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.stats .card span { font-size: 13px; color: var(--muted); font-weight: 800; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; }
.switch { width: 52px; height: 30px; border-radius: 999px; background: var(--lock); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch.on { background: var(--green); } .switch.on::after { transform: translateX(22px); }
.muted { color: var(--muted); font-size: 14px; margin: 0; }

.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: max-content; z-index: 80; background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 16px; display: flex; gap: 10px; align-items: center; font-weight: 800; animation: drop .3s ease-out; max-width: calc(100% - 32px); }
.toast .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--c, var(--sun)); color: #fff; flex: none; }
.toast .ic svg { width: 20px; height: 20px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
.loading { color: var(--muted); font-weight: 700; font-size: 14px; }

@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .6; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

:root[data-theme="dark"] svg.mascot { filter: drop-shadow(0 0 1.2px rgba(255,255,255,.45)); }
.card.cloud h3 { margin: 0; }

.cl-row { display: flex; align-items: center; gap: 12px; }

/* ---------- Bilag'on uchib kelib salomlashadi (birinchi sahifa) ---------- */
.perch { position: relative; width: 150px; height: 165px; }
.perch .shadow { position: absolute; left: 50%; bottom: -4px; width: 96px; height: 12px; margin-left: -48px; border-radius: 50%; background: rgba(22, 48, 30, .16); animation: shadow 1.5s ease-out both; }
.flyer { position: relative; width: 150px; height: 165px; }
.flyer svg.mascot { width: 150px; height: 165px; display: block; }
.intro .flyer { animation: flyin 1.5s cubic-bezier(.33, .62, .36, 1) both; }
.intro .flyer svg.mascot { animation: float 3s ease-in-out 2.6s infinite; }
@keyframes flyin {
  0% { transform: translate(58vw, -44vh) rotate(20deg) scale(.42); }
  28% { transform: translate(34vw, -38vh) rotate(-2deg) scale(.56); }
  55% { transform: translate(-16vw, -28vh) rotate(-16deg) scale(.76); }
  78% { transform: translate(-5vw, -12px) rotate(7deg) scale(.97); }
  88% { transform: translate(0, 0) scale(1.1, .86); }
  95% { transform: translateY(-7px) scale(.97, 1.04); }
  100% { transform: none; }
}
@keyframes shadow { 0%, 40% { opacity: 0; transform: scale(.3); } 88% { opacity: 1; transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
.m-wing, .m-crest { transform-box: view-box; }
.m-wing.l { transform-origin: 28px 66px; } .m-wing.r { transform-origin: 72px 66px; }
.m-crest { transform-origin: 50px 54px; }
.intro .m-wing.l { animation: flapL .13s ease-in-out 12 alternate; }
.intro .m-wing.r { animation: flapR .13s ease-in-out 12 alternate, wave .36s ease-in-out 1.75s 4 alternate; }
.intro .m-crest { animation: crest .55s cubic-bezier(.3, 1.7, .5, 1) 1.4s both; }
@keyframes flapL { from { transform: rotate(-38deg); } to { transform: rotate(26deg); } }
@keyframes flapR { from { transform: rotate(38deg); } to { transform: rotate(-26deg); } }
@keyframes wave { from { transform: rotate(0); } to { transform: rotate(-34deg); } }
@keyframes crest { from { transform: scale(.5) rotate(0); } 60% { transform: scale(1.12); } to { transform: scale(1); } }
.flyer .hi { position: absolute; top: 4px; left: calc(100% - 8px); white-space: nowrap; background: var(--surface); border: 2px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 5px 10px; font-weight: 900; font-size: 15px; color: var(--ink); box-shadow: var(--shadow); transform-origin: 0 100%; opacity: 0; }
.intro .flyer .hi { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) 1.55s both; }
@keyframes pop { from { opacity: 0; transform: scale(.2) rotate(-10deg); } to { opacity: 1; transform: none; } }
.spark { position: absolute; font-style: normal; color: var(--sun); font-size: 18px; opacity: 0; pointer-events: none; }
.spark.a { left: 2px; top: 52px; --dx: -26px; --dy: -14px; } .spark.b { right: 0; top: 58px; --dx: 26px; --dy: -10px; }
.spark.c { left: 18px; bottom: 8px; --dx: -22px; --dy: 10px; font-size: 13px; } .spark.d { right: 16px; bottom: 6px; --dx: 22px; --dy: 12px; font-size: 13px; }
.intro .spark { animation: spark .7s ease-out 1.32s both; }
@keyframes spark { 0% { opacity: 0; transform: scale(.3); } 35% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(40deg); } }
.intro .rise { animation: rise .55s ease-out both; }
.intro .d1 { animation-delay: 1.75s; } .intro .d2 { animation-delay: 1.95s; } .intro .d3 { animation-delay: 2.15s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.intro { overflow: hidden; }
.intro.skip *, .intro.skip *::before { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
.intro.skip .flyer .hi { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .intro *, .intro *::before { animation: none !important; } .flyer .hi { opacity: 1; } }
/* fon musiqasi tugmasi (tepada) */
.mus { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.mus svg { width: 21px; height: 21px; }
.mus.on { color: var(--green); }
.mus.on svg .x { display: none; }
.mus svg .x { stroke: var(--heart); }
/* ---- kunlik vazifalar, olov himoyasi ---- */
.quests { display: flex; flex-direction: column; gap: 12px; }
.quests .qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.coins { font-weight: 900; font-variant-numeric: tabular-nums; background: var(--sun-soft); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 15px; white-space: nowrap; }
.quest, .freeze { display: flex; align-items: center; gap: 12px; }
.quest .qi, .freeze .fz-ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--sun-soft); color: var(--sun); }
.quest .qi svg { width: 20px; height: 20px; }
.quest.ok .qi { background: var(--green); color: #fff; }
.quest .qt, .freeze .qt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.quest .qt b, .freeze .qt b { font-size: 15px; font-weight: 800; line-height: 1.25; }
.quest.ok .qt b { color: var(--muted); }
.quest.ok .qt i.bar > i { background: var(--green); }
.quest .qn { font-weight: 900; font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.quest.ok .qn { color: var(--green); }
.freeze { border-top: 2px dashed var(--line); padding-top: 12px; }
.freeze .fz-ic { background: var(--sky-soft); font-size: 18px; }
.freeze .qt small { font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.3; }
.freeze .btn { flex: none; white-space: nowrap; }
/* ---- o'rnatish kartasi ---- */
.card.install { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 12px; row-gap: 10px; padding: 12px 10px 14px 14px; border-color: color-mix(in srgb, var(--green) 45%, var(--line)); }
.card.install .ic { font-size: 26px; }
.card.install .txt { display: flex; flex-direction: column; }
.card.install .txt b { font-family: var(--f-display); font-size: 17px; line-height: 1.2; }
.card.install .txt small { font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.3; }
.card.install .btn { grid-column: 1 / -1; margin-right: 4px; }
.card.install .x { width: 32px; height: 32px; color: var(--muted); display: grid; place-items: center; align-self: start; }
.card.install .x svg { width: 16px; height: 16px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; }
.kbd { display: inline-block; border: 2px solid var(--line); border-radius: 8px; padding: 0 6px; font-weight: 800; }
/* ---- xatolar kartasi ---- */
.course.mist .ic { background: var(--sky); }
/* ---- sakrash tugmasi (bo'lim banneri) ---- */
.banner .pill.jump { color: #fff; cursor: pointer; border: 2px solid rgba(255, 255, 255, .55); background: rgba(255, 255, 255, .18); padding: 6px 10px; }
.banner .pill.jump:active { transform: translateY(1px); }
/* ---- reyting: Hammasi / Do'stlar ---- */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border-radius: 10px; padding: 9px 8px; font-weight: 900; color: var(--muted); font-size: 15px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.invite-cta { display: flex; gap: 12px; align-items: center; }
.invite-cta svg.mascot { width: 64px; height: 72px; flex: none; }
.invite-cta b { font-family: var(--f-display); font-size: 18px; display: block; }
.invite-cta p { margin: 2px 0 10px; }
/* ---- portfolio, do'stlar ---- */
.portf { display: flex; flex-direction: column; gap: 12px; }
.portf .pf-row { display: flex; align-items: center; gap: 12px; }
.portf .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--sun-soft); font-size: 24px; flex: none; }
.portf .ic svg { width: 22px; height: 22px; }
.portf .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.portf .txt b { font-family: var(--f-display); font-size: 18px; line-height: 1.2; }
.portf .txt small { font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.35; }
.portf .lockic { color: var(--lock-d); flex: none; }
.portf .lockic svg { width: 20px; height: 20px; }
.portf .row, .friends .row { display: flex; gap: 10px; flex-wrap: wrap; }
.portf .row .btn, .friends .row .btn { flex: 1 1 140px; }
.card.tg .btn { flex: none; text-decoration: none; }
/* ---- Profil (qayta dizayn) ---- */
.prof { gap: 14px; padding-top: 22px; }
.prof h3.ph { font-size: 18px; margin: 8px 2px -4px; }
.phero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 6px 0 4px; }
.pav { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--t) 18%, var(--surface)); border: 4px solid var(--t); color: var(--t); font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; overflow: hidden; box-shadow: var(--shadow); }
.pav svg.mascot { width: 74px; height: 82px; margin-top: 10px; }
.pname { display: inline-flex; align-items: center; justify-content: center; gap: 8px; max-width: 100%; padding: 2px 6px; border-radius: 12px; }
.pname .nm { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.15; overflow-wrap: anywhere; color: var(--ink); }
.pname .nm.empty { color: var(--muted); font-size: 22px; }
.pname .pen { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.pname .pen svg { width: 18px; height: 18px; }
.pname:active .pen { background: var(--sky-soft); color: var(--sky); }
.pmeta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 13px; font-weight: 800; }
.pmeta .tier { color: #fff; background: var(--t); border-radius: 999px; padding: 4px 12px; }
.pmeta .acct { color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; }
.pmeta .acct.on { color: var(--green); background: var(--green-soft); }
.pstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pst { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; }
.pst .pi { grid-row: 1 / 3; font-size: 24px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); }
.pst b { font-family: var(--f-display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pst small { font-size: 12px; font-weight: 800; color: var(--muted); line-height: 1.2; }
.card.acct .g-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.setlist { padding: 4px 16px; }
.srow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow.col { flex-direction: column; align-items: stretch; gap: 10px; }
.srow .st { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.srow .st b { font-weight: 800; font-size: 16px; }
.srow .st small { font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.3; }
.srow .btn { flex: none; text-decoration: none; }
.gseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.gseg button { border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 0; color: var(--muted); }
.gseg button b { font-weight: 900; font-size: 15px; }
.gseg button small { font-size: 12px; font-weight: 700; }
.gseg button.on { background: var(--surface); color: var(--sky); box-shadow: var(--shadow); }
.prof .badges { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.prof .more { align-self: center; text-transform: none; letter-spacing: 0; }
.card.about { display: flex; flex-direction: column; gap: 8px; }
.card.about b { font-family: var(--f-display); font-size: 17px; }
.nm-in { width: 100%; font: inherit; font-size: 18px; font-weight: 700; color: var(--ink); background: var(--surface-2); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.nm-in:focus { border-color: var(--sky); outline: none; }
.nm-err { color: var(--heart); font-weight: 700; min-height: 1em; margin-top: -6px; }
.pav { position: relative; overflow: visible; }
.pav img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
.pav svg.mascot { border-radius: 0; }
.pav .cam { position: absolute; right: -4px; bottom: -2px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); font-size: 16px; box-shadow: var(--shadow); }
.sheet-modal label.btn { cursor: pointer; }
.btn.ghost.red-t { color: var(--heart); }
.nm-err:empty { display: none; }
.rank .av { overflow: hidden; }
.rank .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pav .emo { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 54px; line-height: 1; }
.emo-head { text-align: center; font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.emo-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.emo-grid button { aspect-ratio: 1; border-radius: 14px; font-size: 26px; line-height: 1; display: grid; place-items: center; border: 3px solid transparent; transition: transform .08s; }
.emo-grid button:active { transform: scale(.92); }
.emo-grid button.on { border-color: var(--sky); }
.btn.ghost.danger { color: var(--heart); border-color: color-mix(in srgb, var(--heart) 45%, var(--line)); --bd: color-mix(in srgb, var(--heart) 35%, var(--line)); }

          { t: "theory", title: "WHERE — elak", analogy: "Un elagi: mayda un o'tadi, kepak qoladi. WHERE shartga mos qatorlarni o'tkazadi.", text: "WHERE FROM dan keyin yoziladi. Taqqoslash: = teng, <> teng emas, > katta, < kichik, >= , <=. Matn bitta tirnoqda yoziladi: 'karta'.", visual: { code: "SELECT *\nFROM buyurtmalar\nWHERE tolov_turi = 'naqd';" }, simple: "WHERE dan keyin shart yozasiz. Faqat shu shartga to'g'ri keladigan qatorlar qoladi." },

          { t: "theory", title: "LIKE va BETWEEN", analogy: "LIKE — \"ismi 'S' bilan boshlanadiganlar\". BETWEEN — \"yoshi 20 dan 30 gacha\".", text: "LIKE 'S%' — S bilan boshlanadi (% — istalgan belgilar). LIKE '%choy%' — ichida 'choy' bor. BETWEEN 20 AND 30 — 20 va 30 ham kiradi. Sana uchun ham ishlaydi: BETWEEN '2026-11-01' AND '2026-11-30'.", visual: { code: "SELECT ism, yosh\nFROM mijozlar\nWHERE ism LIKE 'S%'\n  AND yosh BETWEEN 20 AND 40;" }, example: "Eslatma: PostgreSQL'da LIKE katta-kichik harfni farqlaydi, ILIKE esa farqlamaydi.", simple: "% — 'bu yerda nima bo'lsa ham'. 'S%' — S bilan boshlanadigan hamma narsa. BETWEEN — ikki son orasidagi hammasi, chetlari bilan." },
          { t: "sql", task: "naqd pul bilan to'langan barcha buyurtmalarni chiqaring.", starter: "SELECT * FROM buyurtmalar\nWHERE ", solution: "SELECT * FROM buyurtmalar WHERE tolov_turi = 'naqd';", tables: ["buyurtmalar"], hint: "WHERE tolov_turi = 'naqd'", use: "To'lov turlari bo'yicha hisobot bank va kassa uchun muhim." },

        steps: [

      {

        simple: "Window funksiya qatorlarni yig'ib tashlamaydi, balki har bir qator yoniga hisob qo'shadi. Masalan, har bir mahsulot yoniga 'kategoriyasidagi o'rni' yoki 'o'tgan oydagi qiymat'.",
        steps: [
          { t: "theory", title: "OVER — oyna (window)", analogy: "Sinf jurnali: har bir o'quvchi qatorida ham bahosi, ham sinfdagi o'rni yozilgan. Hech kim yo'qolmaydi.", text: "GROUP BY qatorlarni bitta qatorga yig'adi. Window funksiya esa har bir qatorni saqlaydi va yoniga hisob qo'shadi. OVER (PARTITION BY guruh ORDER BY tartib) — qaysi guruh ichida va qanday tartibda hisoblash.", visual: { code: "SELECT nomi, kategoriya, narx,\n  ROW_NUMBER() OVER (\n    PARTITION BY kategoriya\n    ORDER BY narx DESC\n  ) AS orni\nFROM mahsulotlar;" }, simple: "PARTITION BY — guruhlarga bo'lish (har kategoriya alohida). ORDER BY — guruh ichida saflash. ROW_NUMBER — safdagi o'rin raqami." },
          { t: "theory", title: "RANK, LAG, LEAD, SUM OVER", analogy: "LAG — \"o'tgan oy qancha edi?\" degan savol, LEAD — \"keyingi oy?\"", text: "ROW_NUMBER — 1, 2, 3 (tenglarga ham har xil). RANK — tenglarga bir xil o'rin, keyin sakraydi (1, 1, 3). LAG(ustun) — oldingi qator qiymati. LEAD — keyingi. SUM(…) OVER (ORDER BY …) — yig'ilib boruvchi jami (running total).", visual: { table: { cols: ["oy", "soni", "LAG(soni)", "jami (SUM OVER)"], rows: [["2026-09", 23, "NULL", 23], ["2026-10", 15, 23, 38], ["2026-11", 12, 15, 50]] } }, simple: "LAG — tepadagi qatorga qarash. SUM OVER — har qatorda shu paytgacha bo'lganlarning jami." },
          { t: "match", q: "Funksiyani vazifasi bilan moslang", pairs: [["ROW_NUMBER()", "Har qatorga ketma-ket raqam"], ["RANK()", "Tenglarga bir xil o'rin"], ["LAG(x)", "Oldingi qator qiymati"], ["SUM(x) OVER (ORDER BY …)", "Yig'ilib boruvchi jami"]], use: "Window funksiyalar — junior va middle analitik orasidagi chegara." },
          { t: "sql", task: "Har bir mahsulotning nomi, kategoriyasi, narxi va kategoriyasi ichidagi narx bo'yicha o'rnini (eng qimmati 1) chiqaring. O'rin ustuni: orni.", starter: "SELECT nomi, kategoriya, narx,\n  ROW_NUMBER() OVER (", solution: "SELECT nomi, kategoriya, narx, ROW_NUMBER() OVER (PARTITION BY kategoriya ORDER BY narx DESC) AS orni FROM mahsulotlar;", tables: ["mahsulotlar"], hint: "OVER (PARTITION BY kategoriya ORDER BY narx DESC) AS orni", use: "\"Har kategoriyada top-1\" kabi savollar shu bilan yechiladi." },
          { t: "sql", task: "CTE va ROW_NUMBER yordamida har bir kategoriyadagi eng qimmat mahsulotni chiqaring: kategoriya, nomi, narx.", starter: "WITH r AS (\n  SELECT kategoriya, nomi, narx,\n    ROW_NUMBER() OVER (PARTITION BY kategoriya ORDER BY narx DESC) AS orni\n  FROM mahsulotlar\n)\nSELECT ", solution: "WITH r AS (SELECT kategoriya, nomi, narx, ROW_NUMBER() OVER (PARTITION BY kategoriya ORDER BY narx DESC) AS orni FROM mahsulotlar) SELECT kategoriya, nomi, narx FROM r WHERE orni = 1;", tables: ["mahsulotlar"], hint: "SELECT kategoriya, nomi, narx FROM r WHERE orni = 1;", use: "\"Har guruhda eng yaxshisi\" — intervyuda eng ko'p beriladigan SQL masalasi." },
          { t: "sql", task: "Oylik buyurtmalar soni va o'tgan oydagi son (LAG) bilan chiqaring: oy, soni, otgan_oy. Oylar tartibida.", starter: "WITH m AS (\n  SELECT strftime('%Y-%m', sana) AS oy, COUNT(*) AS soni\n  FROM buyurtmalar GROUP BY oy\n)\nSELECT oy, soni, ", solution: "WITH m AS (SELECT strftime('%Y-%m', sana) AS oy, COUNT(*) AS soni FROM buyurtmalar GROUP BY oy) SELECT oy, soni, LAG(soni) OVER (ORDER BY oy) AS otgan_oy FROM m ORDER BY oy;", tables: ["buyurtmalar"], hint: "LAG(soni) OVER (ORDER BY oy) AS otgan_oy", use: "Oyma-oy o'zgarish (MoM) hisobi aynan LAG bilan qilinadi." },
          { t: "sql", task: "Oylik buyurtmalar va yig'ilib boruvchi jami (running total) ni chiqaring: oy, soni, jami. Oylar tartibida.", starter: "WITH m AS (\n  SELECT strftime('%Y-%m', sana) AS oy, COUNT(*) AS soni\n  FROM buyurtmalar GROUP BY oy\n)\nSELECT oy, soni, ", solution: "WITH m AS (SELECT strftime('%Y-%m', sana) AS oy, COUNT(*) AS soni FROM buyurtmalar GROUP BY oy) SELECT oy, soni, SUM(soni) OVER (ORDER BY oy) AS jami FROM m ORDER BY oy;", tables: ["buyurtmalar"], hint: "SUM(soni) OVER (ORDER BY oy) AS jami", use: "Yil boshidan beri jami (YTD) — moliya hisobotlarining standarti." },
          { t: "predict", q: "Ballar: 90, 85, 85, 70. RANK() OVER (ORDER BY ball DESC) natijasi?", o: ["1, 2, 2, 4", "1, 2, 3, 4", "1, 2, 2, 3", "1, 1, 2, 3"], a: 0, why: "Teng ballar bir xil o'rin oladi, keyingi o'rin sakraydi. 1, 2, 3 bersa — DENSE_RANK.", use: "Reyting hisobotlarida RANK va DENSE_RANK farqini bilish kerak." },
          { t: "bug", code: true, q: "Xatoni bosing", tokens: ["SELECT nomi,", "ROW_NUMBER()", "(ORDER BY narx DESC)", "FROM mahsulotlar;"], a: 2, why: "Window funksiyadan keyin OVER so'zi shart: ROW_NUMBER() OVER (ORDER BY narx DESC).", use: "OVER'siz window funksiya ishlamaydi." },

      {

          { t: "sql", task: "Har bir mijozning ismi va buyurtmalar sonini chiqaring (faqat buyurtma berganlar). Ustunlar: ism, soni. Ism bir xil mijozlar bo'lishi mumkin — GROUP BY'da m.mijoz_id ham bo'lsin.", starter: "SELECT m.ism, COUNT(*) AS soni\nFROM mijozlar m\nJOIN buyurtmalar b ON m.mijoz_id = b.mijoz_id\n", solution: "SELECT m.ism, COUNT(*) AS soni FROM mijozlar m JOIN buyurtmalar b ON m.mijoz_id = b.mijoz_id GROUP BY m.mijoz_id, m.ism;", tables: ["mijozlar", "buyurtmalar"], hint: "GROUP BY m.mijoz_id, m.ism", use: "Ismlar takrorlanadi — doim ID bo'yicha guruhlang." },
          { t: "sql", task: "Har bir mijozni segmentga ajrating va segmentlar bo'yicha mijozlar sonini chiqaring: 3+ buyurtma — 'Sodiq', 2 — 'Qaytgan', 1 — 'Bir martalik'. Ustunlar: segment, mijozlar.", starter: "WITH c AS (\n  SELECT mijoz_id, COUNT(*) AS n FROM buyurtmalar GROUP BY mijoz_id\n)\nSELECT\n  CASE ", solution: "WITH c AS (SELECT mijoz_id, COUNT(*) AS n FROM buyurtmalar GROUP BY mijoz_id) SELECT CASE WHEN n >= 3 THEN 'Sodiq' WHEN n = 2 THEN 'Qaytgan' ELSE 'Bir martalik' END AS segment, COUNT(*) AS mijozlar FROM c GROUP BY segment;", tables: ["buyurtmalar"], hint: "CASE WHEN n >= 3 THEN 'Sodiq' WHEN n = 2 THEN 'Qaytgan' ELSE 'Bir martalik' END AS segment ... GROUP BY segment", use: "Mijozlar segmentatsiyasi — sadoqat dasturining asosi." },
          { t: "sql", task: "Yetkazilgan buyurtmalar bo'yicha har bir mijozning jami xaridini hisoblab, eng ko'p sarflagan 3 mijozni chiqaring: ism, jami.", starter: "SELECT m.ism, SUM(b.soni * p.narx) AS jami\nFROM buyurtmalar b\nJOIN mijozlar m ON b.mijoz_id = m.mijoz_id\nJOIN mahsulotlar p ON b.mahsulot_id = p.mahsulot_id\n", solution: "SELECT m.ism, SUM(b.soni * p.narx) AS jami FROM buyurtmalar b JOIN mijozlar m ON b.mijoz_id = m.mijoz_id JOIN mahsulotlar p ON b.mahsulot_id = p.mahsulot_id WHERE b.holat = 'yetkazildi' GROUP BY m.mijoz_id, m.ism ORDER BY jami DESC LIMIT 3;", tables: ["buyurtmalar", "mijozlar", "mahsulotlar"], hint: "WHERE b.holat = 'yetkazildi' GROUP BY m.mijoz_id, m.ism ORDER BY jami DESC LIMIT 3", use: "Uch jadvalli JOIN — real ishdagi odatiy holat." },
          { t: "sql", task: "Ro'yxatdan o'tgan, lekin hech qachon buyurtma bermagan mijozlar sonini toping.", starter: "SELECT COUNT(*)\nFROM mijozlar m\nLEFT JOIN buyurtmalar b ON m.mijoz_id = b.mijoz_id\n", solution: "SELECT COUNT(*) FROM mijozlar m LEFT JOIN buyurtmalar b ON m.mijoz_id = b.mijoz_id WHERE b.buyurtma_id IS NULL;", tables: ["mijozlar", "buyurtmalar"], hint: "WHERE b.buyurtma_id IS NULL", use: "Faollashtirish kampaniyasi uchun auditoriya." },
          { t: "sql", task: "Har bir mijozning birinchi buyurtma sanasini ROW_NUMBER bilan toping: mijoz_id, sana (har mijozdan bitta qator).", starter: "WITH r AS (\n  SELECT mijoz_id, sana,\n    ROW_NUMBER() OVER (PARTITION BY mijoz_id ORDER BY sana, buyurtma_id) AS n\n  FROM buyurtmalar\n)\nSELECT ", solution: "WITH r AS (SELECT mijoz_id, sana, ROW_NUMBER() OVER (PARTITION BY mijoz_id ORDER BY sana, buyurtma_id) AS n FROM buyurtmalar) SELECT mijoz_id, sana FROM r WHERE n = 1;", tables: ["buyurtmalar"], hint: "SELECT mijoz_id, sana FROM r WHERE n = 1;", use: "Birinchi xarid sanasi — kohort (cohort) tahlilining boshlang'ich nuqtasi." },
          { t: "case", title: "Direktorga xulosa", story: "25 mijoz xarid qilgan: 5 tasi sodiq (3+), 9 tasi qaytgan (2), 11 tasi bir martalik. 5 mijoz umuman xarid qilmagan. Top mijozlar asosan elektronika olgan.", steps: [
            { q: "Qaysi xulosa eng foydali?", o: ["11 ta bir martalik mijozni ikkinchi xaridga undash (masalan, 2-xaridga chegirma) eng katta imkoniyat. Sodiqlarga sadoqat dasturi, 5 ta xarid qilmaganga xush kelibsiz taklifi.", "Hamma mijozlarga bir xil chegirma beramiz.", "Sodiq mijozlar yetarli, boshqa ish kerak emas."], a: 0, why: "Har bir segmentga alohida harakat — natijaviy marketing." },
            { q: "Dastur ishlayotganini qanday o'lchaysiz?", o: ["Bir martalik mijozlarning qayta xarid ulushini dasturdan oldin va keyin (yaxshisi A/B test bilan) solishtirish", "Mijozlardan yoqdimi deb so'rash", "Hech qanday o'lchov kerak emas"], a: 0, why: "Aniq KPI va taqqoslash guruhi bo'lmasa, natijani isbotlab bo'lmaydi." }
          ], use: "SQL + statistika + biznes fikrlash — shu uchtasi birga analitikni qimmatli qiladi." },

          { t: "theory", title: "Topish va olib tashlash", analogy: "Ro'yxatni ism va telefon bo'yicha saralab, yonma-yon turgan egizaklarni topish.", text: "Topish: GROUP BY ism, telefon HAVING COUNT(*) > 1. Olib tashlash: SELECT DISTINCT … yoki ROW_NUMBER() OVER (PARTITION BY ism, telefon) = 1 ni qoldirish. Excel'da: Data → Remove Duplicates.", visual: { code: "SELECT ism, telefon, COUNT(*) AS n\nFROM mijozlar_xom\nGROUP BY ism, telefon\nHAVING COUNT(*) > 1;" }, simple: "Kalit ustunlar (ism + telefon) bo'yicha guruhlaymiz. Guruhda 1 tadan ko'p qator bo'lsa — dublikat." },
          { t: "sql", task: "ism va telefon bo'yicha takrorlangan yozuvlarni toping: ism, telefon, n (soni).", starter: "SELECT ism, telefon, COUNT(*) AS n\nFROM mijozlar_xom\n", solution: "SELECT ism, telefon, COUNT(*) AS n FROM mijozlar_xom GROUP BY ism, telefon HAVING COUNT(*) > 1;", tables: ["mijozlar_xom"], hint: "GROUP BY ism, telefon HAVING COUNT(*) > 1", use: "CRM bazasini tozalashning standart birinchi qadami." },
          { t: "sql", task: "id'siz noyob yozuvlar sonini toping: ism, telefon, tuman, summa, sana bo'yicha DISTINCT qilib sanang.", starter: "SELECT COUNT(*) FROM (\n  SELECT DISTINCT ", solution: "SELECT COUNT(*) FROM (SELECT DISTINCT ism, telefon, tuman, summa, sana FROM mijozlar_xom);", tables: ["mijozlar_xom"], hint: "SELECT DISTINCT ism, telefon, tuman, summa, sana FROM mijozlar_xom", use: "Dublikatlar sonini bilish: 12 − 10 = 2 ta ortiqcha qator." },
          { t: "sql", task: "ROW_NUMBER bilan har bir (ism, telefon) juftligidan faqat eng kichik id'li qatorni qoldiring: id, ism, telefon.", starter: "WITH r AS (\n  SELECT id, ism, telefon,\n    ROW_NUMBER() OVER (PARTITION BY ism, telefon ORDER BY id) AS n\n  FROM mijozlar_xom\n)\nSELECT ", solution: "WITH r AS (SELECT id, ism, telefon, ROW_NUMBER() OVER (PARTITION BY ism, telefon ORDER BY id) AS n FROM mijozlar_xom) SELECT id, ism, telefon FROM r WHERE n = 1;", tables: ["mijozlar_xom"], hint: "SELECT id, ism, telefon FROM r WHERE n = 1;", use: "Bu usul qaysi nusxani qoldirishni boshqarishga imkon beradi (eng birinchi yoki eng yangi)." },

          { t: "theory", title: "Chalg'ituvchi grafiklar", analogy: "Do'kon vitrinasida kichik olmani kattalashtiruvchi oyna — rost emas, lekin ishonasiz.", text: "Eng ko'p uchraydigan xatolar: Y o'qi 0 dan boshlanmagan ustunli grafik (farq kattaroq ko'rinadi), 10+ bo'lakli doira, 3D effektlar, juda ko'p rang. Ustunli grafikda Y o'qi doim 0 dan boshlanishi kerak.", visual: { bars: [["Sentabr", 33687], ["Oktabr", 6720], ["Noyabr", 6402]], unit: "ming so'm" }, example: "Yuqorida yetkazilgan buyurtmalar tushumi (ming so'm). Y o'qi 0 dan — farq haqiqiy ko'rinishda." },

          { t: "chart", q: "Direktor faqat bitta raqamni ko'rmoqchi: shu oygi jami tushum", o: ["pie", "line", "kpi", "bar"], a: 2, why: "Bitta asosiy son — KPI karta. Yoniga o'tgan oyga nisbatan o'zgarishni yozish mumkin.", use: "KPI kartalar dashboardning eng yuqori qatoriga qo'yiladi." },

      {
        id: "s6l3", title: "Data model va star schema", goal: "Fakt va o'lchov jadvallarini bog'lash",
        simple: "Markazda fakt jadvali (buyurtmalar — nima bo'ldi), atrofida o'lchov jadvallari (mijozlar, mahsulotlar, tumanlar — kim, nima, qayerda). Rasmda yulduzga o'xshaydi.",
        steps: [
          { t: "theory", title: "Fakt va o'lchov (dimension)", analogy: "Chek — fakt (nima sotildi, qancha). Mijoz kartasi, tovar katalogi — ma'lumotnomalar.", text: "Fakt jadvali — hodisalar: har bir buyurtma, son, sana. U uzun va tez o'sadi. O'lchov (dimension) jadvallari — tavsiflar: mijoz ismi, mahsulot kategoriyasi, tuman viloyati. Bizning kursda: buyurtmalar — fakt; mijozlar, mahsulotlar, tumanlar — o'lchov.", visual: { chips: ["⭐ buyurtmalar (fakt, 50)", "mijozlar (30)", "mahsulotlar (20)", "tumanlar (20)"] } },
          { t: "theory", title: "Bog'lanish (relationship)", analogy: "Pasport raqami orqali odamning barcha hujjatlarini topish.", text: "Power BI'da Model oynasida jadvallar kalit ustunlar bilan bog'lanadi: mahsulotlar[mahsulot_id] (1) → buyurtmalar[mahsulot_id] (*). Bu \"birga-ko'p\" (1:*) bog'lanish: bitta mahsulot ko'p buyurtmada bo'ladi. Filtr o'lchovdan faktga qarab oqadi.", visual: { code: "mahsulotlar 1 ──→ * buyurtmalar\n   kalit: mahsulot_id\nmijozlar    1 ──→ * buyurtmalar\n   kalit: mijoz_id\ntumanlar    1 ──→ * mijozlar\n   kalit: tuman_id" } },
          { t: "mc", q: "Qaysi jadval fakt jadvali?", o: ["buyurtmalar", "mahsulotlar", "tumanlar", "mijozlar"], a: 0, why: "Buyurtmalar — hodisalar (kim, qachon, qancha sotib oldi). Qolganlari ularni tavsiflaydi.", use: "Modelni qurishda birinchi savol: fakt jadvalim qaysi?" },
          { t: "match", q: "Ustunni jadval turi bilan moslang", pairs: [["soni (buyurtmada)", "Fakt"], ["kategoriya", "O'lchov: mahsulotlar"], ["viloyat", "O'lchov: tumanlar"], ["jinsi", "O'lchov: mijozlar"]], use: "Sonli hodisalar faktga, tavsiflar o'lchovga boradi." },
          { t: "sql", task: "Model bog'lanishini SQL'da tekshiring: har bir kategoriya bo'yicha buyurtmalar sonini chiqaring (kategoriya, n), n bo'yicha kamayish tartibida.", starter: "SELECT m.kategoriya, COUNT(*) AS n\nFROM buyurtmalar b\nJOIN mahsulotlar m ON ", solution: "SELECT m.kategoriya, COUNT(*) AS n FROM buyurtmalar b JOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id GROUP BY m.kategoriya ORDER BY n DESC;", tables: ["buyurtmalar", "mahsulotlar"], hint: "ON m.mahsulot_id = b.mahsulot_id GROUP BY m.kategoriya ORDER BY n DESC", unordered: true, use: "Power BI'da kategoriya bo'yicha grafik chizganda aynan shu JOIN orqada bajariladi." },
          { t: "tf", q: "Star schema'da o'lchov jadvallari bir-biriga emas, fakt jadvaliga bog'lanadi.", a: true, why: "Klassik yulduz: markazda fakt, nurlar — o'lchovlar. tumanlar → mijozlar zanjiri esa \"snowflake\" (qor parchasi) ko'rinishi.", use: "Oddiy yulduz model DAX'ni tez va tushunarli qiladi." },
          { t: "bug", q: "Model ishlamayapti: kategoriya bo'yicha hamma ustun bir xil chiqyapti. Qaysi bog'lanish noto'g'ri?", tokens: ["mahsulotlar[mahsulot_id] → buyurtmalar[mahsulot_id]", "mijozlar[mijoz_id] → buyurtmalar[mijoz_id]", "mahsulotlar[narx] → buyurtmalar[soni]"], a: 2, why: "Bog'lanish kalit ustunlar orqali bo'ladi. narx va soni — kalit emas, bu ma'nosiz bog'lanish.", use: "Grafikda hamma qiymat bir xil chiqsa — birinchi navbatda bog'lanishlarni tekshiring." }
        ]

      {
        id: "s6l4", title: "DAX asoslari", goal: "Measure yozish: SUM, COUNTROWS, SUMX, CALCULATE, DIVIDE",
        simple: "DAX — Power BI formulalari. Measure (o'lchov) — grafikka qo'yiladigan hisob: jami tushum, buyurtmalar soni. CALCULATE — filtr qo'shib hisoblaydi, DIVIDE — nolga bo'lishdan himoya qiladi.",
        steps: [
          { t: "theory", title: "Measure va SUMX", analogy: "Excel'dagi SUM, lekin u grafikdagi har bir ustun uchun o'zi qayta hisoblanadi.", text: "Measure — nomlangan formula. Buyurtmalar soni = COUNTROWS(buyurtmalar). Tushum narx × son bo'lgani uchun qator-qator hisoblash kerak: SUMX(jadval, ifoda). RELATED() bog'langan o'lchov jadvalidan qiymat oladi.", visual: { code: "Buyurtmalar soni =\n  COUNTROWS(buyurtmalar)\n\nTushum =\nSUMX(\n  buyurtmalar,\n  buyurtmalar[soni]\n    * RELATED(mahsulotlar[narx])\n)" }, example: "Bizning ma'lumotda Tushum = 60 991 000 so'm (barcha 50 buyurtma)." },
          { t: "theory", title: "CALCULATE va DIVIDE", analogy: "\"Faqat yetkazilganlarni sana\" — kalkulyatorga filtr qo'shish.", text: "CALCULATE(measure, filtr) — measure'ni qo'shimcha shart bilan hisoblaydi. DIVIDE(a, b) — a/b, lekin b = 0 bo'lsa xato o'rniga bo'sh qaytaradi. O'rtacha chek = DIVIDE([Tushum], [Buyurtmalar soni]).", visual: { code: "Yetkazilgan tushum =\nCALCULATE(\n  [Tushum],\n  buyurtmalar[holat] = \"yetkazildi\"\n)\n\nO'rtacha chek =\nDIVIDE(\n  [Yetkazilgan tushum],\n  [Yetkazilgan soni]\n)" }, example: "Yetkazilgan tushum = 46 809 000 so'm, yetkazilganlar 37 ta → o'rtacha chek ≈ 1 265 108 so'm." },
          { t: "sql", task: "DAX'dagi [Tushum] measure'ini SQL'da hisoblang: SUM(soni × narx) barcha buyurtmalar bo'yicha. Ustun nomi: tushum.", starter: "SELECT SUM(b.soni * m.narx) AS tushum\nFROM buyurtmalar b\n", solution: "SELECT SUM(b.soni * m.narx) AS tushum FROM buyurtmalar b JOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id;", tables: ["buyurtmalar", "mahsulotlar"], hint: "JOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id", use: "Measure natijasini SQL bilan solishtirish — dashboard to'g'riligini tekshirishning ishonchli usuli." },
          { t: "sql", task: "Endi CALCULATE filtri: faqat holat = 'yetkazildi' bo'lgan buyurtmalar tushumi. Ustun nomi: tushum.", starter: "SELECT SUM(b.soni * m.narx) AS tushum\nFROM buyurtmalar b\nJOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id\n", solution: "SELECT SUM(b.soni * m.narx) AS tushum FROM buyurtmalar b JOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id WHERE b.holat = 'yetkazildi';", tables: ["buyurtmalar", "mahsulotlar"], hint: "WHERE b.holat = 'yetkazildi'", use: "Bekor qilingan buyurtmalar tushumga kirmasligi kerak — bu klassik xato." },
          { t: "fill", code: true, q: "Faqat karta orqali to'langan buyurtmalar soni", tpl: "Karta soni = ___(COUNTROWS(buyurtmalar), buyurtmalar[tolov_turi] = ___)", o: ["CALCULATE", "\"karta\"", "SUMX", "\"naqd\"", "FILTER"], a: ["CALCULATE", "\"karta\""], use: "To'lov turlari ulushi — bank va onlayn do'konlarda doimiy KPI." },
          { t: "predict", q: "Karta orqali to'langan buyurtmalar 36 ta, jami 50 ta. Bu measure nima qaytaradi?", code: "Karta ulushi =\nDIVIDE(\n  [Karta soni],\n  [Buyurtmalar soni]\n)", o: ["0.72 (72%)", "36", "1.39", "Xato"], a: 0, why: "36 / 50 = 0.72. Format bilan foiz qilib ko'rsatiladi.", use: "Ulushlarni DIVIDE bilan hisoblash — nolga bo'lish xatosidan himoya." },
          { t: "mc", q: "Nega O'rtacha chek = [Tushum] / [Buyurtmalar soni] o'rniga DIVIDE ishlatiladi?", o: ["Filtrda buyurtma bo'lmasa (0), xato o'rniga bo'sh qaytaradi", "DIVIDE tezroq bo'ladi", "/ belgisi DAX'da yo'q", "Natija yaxlitlanadi"], a: 0, why: "Masalan, hali buyurtma bo'lmagan tuman tanlansa, / xato beradi, DIVIDE esa bo'sh qoladi.", use: "Dashboard'da xato belgilari foydalanuvchi ishonchini yo'qotadi." },
          { t: "match", q: "DAX funksiyasini vazifasi bilan moslang", pairs: [["COUNTROWS", "Qatorlarni sanash"], ["SUMX", "Qatorma-qator hisoblab yig'ish"], ["CALCULATE", "Filtr bilan hisoblash"], ["RELATED", "Bog'langan jadvaldan qiymat olish"]], use: "Bu to'rttasi bilan oddiy savdo modelining 90% measure'lari yoziladi." }
        ]

      {
        id: "s6l5", title: "Dashboard va KPI kartalar", goal: "Bir sahifali dashboardni rejalashtirish",
        simple: "Yaxshi dashboard 5 soniyada asosiy javobni beradi. Yuqorida KPI kartalar, o'rtada dinamika, pastda tafsilot. Slicer (filtr) — foydalanuvchi o'zi tuman yoki oyni tanlaydi.",
        steps: [

          { t: "order", q: "Dashboardni yuqoridan pastga tartiblang", blocks: ["Sarlavha va slicer'lar", "KPI kartalar", "Oylik tushum (line)", "Kategoriya bo'yicha (bar)", "Batafsil jadval"], use: "Ko'z yuqori chapdan boshlaydi — eng muhimi o'sha yerda." },
          { t: "chart", q: "Tushumning kategoriyalar bo'yicha taqsimoti: Elektronika 34.3 mln, Kiyim 5.9, Uy-ro'zg'or 4.5, Oziq-ovqat 1.3, Kitoblar 0.9", o: ["bar", "line", "kpi", "scatter"], a: 0, why: "5 ta toifani solishtirish — saralangan ustunli grafik.", use: "Kategoriya bo'yicha bar — savdo dashboardining standart elementi." },
          { t: "mc", q: "Direktor: \"Dashboardda 14 ta grafik bor, nima muhimligini tushunmayapman\". Nima qilasiz?", o: ["Asosiy savolga javob beradigan 4–6 vizualni qoldiraman, qolganini alohida sahifaga", "Ranglarni yorqinroq qilaman", "Yana grafik qo'shaman", "Hamma grafikni doiraga aylantiraman"], a: 0, why: "Dashboard — qaror uchun vosita. Kam, lekin aniq vizual yaxshiroq.", use: "Ko'p sahifali hisobot: 1-sahifa umumiy ko'rinish, keyingilari — chuqur tahlil." },
          { t: "sql", task: "KPI kartalar uchun yetkazilgan buyurtmalarning soni va o'rtacha chekini hisoblang: n va chek (ROUND bilan butun songa).", starter: "SELECT COUNT(*) AS n,\n       ROUND(SUM(b.soni * m.narx) * 1.0 / COUNT(*)) AS chek\nFROM buyurtmalar b\nJOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id\n", solution: "SELECT COUNT(*) AS n, ROUND(SUM(b.soni * m.narx) * 1.0 / COUNT(*)) AS chek FROM buyurtmalar b JOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id WHERE b.holat = 'yetkazildi';", tables: ["buyurtmalar", "mahsulotlar"], hint: "WHERE b.holat = 'yetkazildi'", use: "KPI raqamlarini SQL bilan tekshirib qo'yish — taqdimotdan oldingi odat." },
          { t: "tf", q: "KPI kartada solishtirish (masalan, \"o'tgan oyga nisbatan −12%\") bo'lsa, raqam tushunarliroq bo'ladi.", a: true, why: "Kontekstsiz raqam — yaxshimi yomonmi, bilib bo'lmaydi. Maqsad yoki o'tgan davr bilan solishtiring.", use: "\"Tushum 6.7 mln\" o'rniga \"6.7 mln (sentabrga nisbatan −80%)\"." }

          { t: "sql", task: "Oylar bo'yicha yetkazilgan tushum: oy (strftime('%Y-%m', sana)) va tushum, oy bo'yicha o'sish tartibida.", starter: "SELECT strftime('%Y-%m', b.sana) AS oy,\n       SUM(b.soni * m.narx) AS tushum\nFROM buyurtmalar b\nJOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id\n", solution: "SELECT strftime('%Y-%m', b.sana) AS oy, SUM(b.soni * m.narx) AS tushum FROM buyurtmalar b JOIN mahsulotlar m ON m.mahsulot_id = b.mahsulot_id WHERE b.holat = 'yetkazildi' GROUP BY oy ORDER BY oy;", tables: ["buyurtmalar", "mahsulotlar"], hint: "WHERE b.holat = 'yetkazildi' GROUP BY oy ORDER BY oy", use: "Oylik dinamika — dashboard o'rtasidagi line grafik uchun ma'lumot." },
