          { t: "theory", title: "COUNTIF va SUMIF", analogy: "Kassir: \"Bugun Chilonzorga nechta buyurtma ketdi va jami qancha?\"", text: "=COUNTIF(B2:B9, \"Chilonzor\") — shartga mos kataklar soni. =SUMIF(B2:B9, \"Chilonzor\", D2:D9) — shartga mos qatorlarning summasi. Shart \">=60\" yoki \"<>bekor\" ham bo'lishi mumkin.", visual: { sheet: SH_ORDERS, hl: "B2:B9" }, simple: "COUNTIF — 'nechta?' (sanaydi). SUMIF — 'qancha?' (qo'shadi). Ikkalasi ham faqat shartga mos qatorlarni oladi." },
          { t: "mc", q: "=IF(C2>=60,\"O'tdi\",\"Qoldi\") — agar C2 = 55 bo'lsa, natija?", o: ["Qoldi", "O'tdi", "55", "Xato"], a: 0, why: "55 ≥ 60 — yolg'on, shuning uchun uchinchi qism: \"Qoldi\".", use: "Imtihon, KPI bajarilishi, kredit tasdiqlash — hammasida IF ishlatiladi." },
          { t: "formula", task: "D2 ga: agar ball (C2) 60 yoki undan yuqori bo'lsa \"O'tdi\", aks holda \"Qoldi\" chiqsin.", sheet: SH_GRADES, target: "D2", solution: "=IF(C2>=60,\"O'tdi\",\"Qoldi\")", must: ["IF"], hint: "=IF(C2>=60,\"O'tdi\",\"Qoldi\") — matnlar qo'shtirnoqda", use: "Ma'lumotni toifalarga ajratish (segmentatsiya) shunday boshlanadi." },
          { t: "fill", code: true, q: "Summa 500 000 dan katta bo'lsa \"Katta\", aks holda \"Kichik\"", tpl: "=IF(D2>500000, ___, ___)", o: ["\"Katta\"", "\"Kichik\"", "D2", "SUM"], a: ["\"Katta\"", "\"Kichik\""], use: "Mijozlarni 'katta' va 'kichik' xaridorlarga ajratish marketingda keng qo'llanadi." },
          { t: "formula", task: "F2 ga Chilonzordan nechta buyurtma borligini toping.", sheet: SH_ORDERS, target: "F2", solution: "=COUNTIF(B2:B9,\"Chilonzor\")", must: ["COUNTIF"], hint: "=COUNTIF(B2:B9,\"Chilonzor\")", use: "Hududlar bo'yicha buyurtmalar soni — logistika rejalashtirishning asosi." },
          { t: "formula", task: "F3 ga Chilonzor buyurtmalarining jami summasini toping.", sheet: SH_ORDERS, target: "F3", solution: "=SUMIF(B2:B9,\"Chilonzor\",D2:D9)", must: ["SUMIF"], hint: "=SUMIF(shart ustuni, \"Chilonzor\", summa ustuni)", use: "Hududlar bo'yicha tushum — har oylik hisobotning standart qismi." },
          { t: "predict", q: "C2:C6 da: 72, 55, 60, 90, 48. Natija qancha?", code: "=COUNTIF(C2:C6,\">=60\")", o: ["3", "2", "4", "5"], a: 0, why: "60 va undan kattalar: 72, 60, 90 — 3 ta.", use: "\"Rejani bajarganlar soni\" kabi hisoblar shunday qilinadi." },
          { t: "tf", q: "IF funksiyasining 3 qismi bor: shart, rost bo'lsa qiymat, yolg'on bo'lsa qiymat.", a: true, use: "Bu tuzilma SQL'dagi CASE WHEN bilan bir xil — keyinroq ko'rasiz." },
          { t: "bug", code: true, q: "Formuladagi xatoni bosing", tokens: ["=IF(", "C2>=60", ",", "O'tdi", ",", "\"Qoldi\"", ")"], a: 3, why: "Matn qo'shtirnoq ichida bo'lishi kerak: \"O'tdi\".", use: "Qo'shtirnoq unutilsa Excel #NAME? xatosini beradi." },
          { t: "match", q: "Funksiyani vazifasi bilan moslang", pairs: [["IF", "Shartga qarab ikki javobdan birini tanlaydi"], ["COUNTIF", "Shartga mos kataklarni sanaydi"], ["SUMIF", "Shartga mos qiymatlarni qo'shadi"], ["AVERAGEIF", "Shartga mos qiymatlar o'rtachasi"]], use: "Bu to'rttasi bilan Pivot'siz ham ko'p hisobot qilsa bo'ladi." },
          { t: "formula", task: "F4 ga bekor qilingan (Holat = \"bekor\") buyurtmalar sonini toping.", sheet: SH_ORDERS, target: "F4", solution: "=COUNTIF(C2:C9,\"bekor\")", must: ["COUNTIF"], hint: "Holat C ustunida.", use: "Bekor qilish darajasi (cancel rate) — onlayn do'konning muhim KPI'si." }
        ]
      },
      {
        id: "s1l4", title: "VLOOKUP va XLOOKUP", goal: "Bir jadvaldan boshqasiga qiymat qidirib olish",
        simple: "Telefon kitobini eslang: ismni topasiz, yonidagi raqamni o'qiysiz. VLOOKUP ham shunday: ID ni topadi va o'sha qatordagi kerakli ustunni beradi.",
        steps: [
          { t: "theory", title: "Qidirib topish", analogy: "Telefon kitobi: ismni topasiz, yonidagi raqamni olasiz.", text: "=VLOOKUP(nima qidiramiz, qayerdan, nechanchi ustun, FALSE). Masalan =VLOOKUP(F2, A2:D6, 4, FALSE) — F2 dagi ID ni A ustundan topib, 4-ustundagi narxni qaytaradi.", visual: { sheet: SH_LOOKUP, hl: "A2:D6", formula: ["G2", "=VLOOKUP(F2,A2:D6,4,FALSE)"] }, simple: "VLOOKUP chap ustundan qidiradi. Topgach, o'ngga qarab 'nechanchi ustun' deb aytganingizni beradi. FALSE — 'faqat aynan bir xilini top'." },
          { t: "theory", title: "XLOOKUP — yangi va sodda", analogy: "VLOOKUP — eski telefon kitobi, XLOOKUP — telefondagi qidiruv.", text: "=XLOOKUP(nima qidiramiz, qidirish ustuni, natija ustuni). Ustun raqamini sanash shart emas va chap tomonga ham qidira oladi. Excel 365 va Google Sheets'da bor.", visual: { code: "=XLOOKUP(F2, A2:A6, C2:C6)" }, simple: "XLOOKUP'ga ikkita ustun berasiz: qayerdan qidirish va qayerdan javob olish. Bo'ldi." },
          { t: "mc", q: "VLOOKUP nima qiladi?", o: ["Jadvaldan qiymatni topib, o'sha qatordagi boshqa ustundan ma'lumot qaytaradi", "Ustunni saralaydi", "Hamma sonlarni qo'shadi", "Grafik chizadi"], a: 0, use: "Ikki jadvalni bog'lash — buyurtmaga mahsulot narxini qo'shish — har kuni kerak." },
          { t: "formula", task: "G2 ga F2 dagi ID ga mos mahsulot narxini VLOOKUP bilan toping.", sheet: SH_LOOKUP, target: "G2", solution: "=VLOOKUP(F2,A2:D6,4,FALSE)", must: ["VLOOKUP"], hint: "Narx — diapazonning 4-ustuni.", use: "Buyurtmalar jadvaliga narx yoki kategoriya qo'shish shunday qilinadi." },
          { t: "fill", code: true, q: "Mahsulot nomini olish uchun nechanchi ustun kerak?", tpl: "=VLOOKUP(F2, A2:D6, ___, FALSE)", o: ["1", "2", "3", "4"], a: ["2"], why: "A — 1, B (Mahsulot) — 2.", use: "Ustun raqamini noto'g'ri berish — VLOOKUP'dagi eng ko'p xato." },
          { t: "tf", q: "VLOOKUP oxiridagi FALSE — \"aniq moslikni qidir\" degani.", a: true, why: "FALSE bo'lmasa, VLOOKUP taxminiy qidiradi va kutilmagan natija berishi mumkin.", use: "ID bo'yicha qidirishda doim FALSE yozing." },
          { t: "formula", task: "G3 ga F2 dagi ID ning kategoriyasini XLOOKUP bilan toping.", sheet: SH_LOOKUP, target: "G3", solution: "=XLOOKUP(F2,A2:A6,C2:C6)", must: ["XLOOKUP"], hint: "=XLOOKUP(F2, ID ustuni, Kategoriya ustuni)", use: "Zamonaviy jamoalarda XLOOKUP VLOOKUP'ni almashtirmoqda." },
          { t: "mc", q: "VLOOKUP qidirilgan qiymatni qaysi ustundan izlaydi?", o: ["Diapazonning eng chap (birinchi) ustunidan", "Eng o'ng ustunidan", "Hamma ustunlardan", "Tasodifiy ustundan"], a: 0, why: "Shuning uchun ID ustuni diapazonda birinchi bo'lishi kerak.", use: "Jadval tuzilishini oldindan bilish formulani tez yozishga yordam beradi." },
          { t: "predict", q: "Natija nima bo'ladi?", code: "=VLOOKUP(5, A2:D6, 2, FALSE)", table: { cols: ["ID", "Mahsulot", "Kategoriya", "Narx"], rows: [[1, "Smartfon A12", "Elektronika", 2900000], [2, "Krossovka", "Kiyim", 520000], [3, "Guruch 5 kg", "Oziq-ovqat", 85000], [4, "Dazmol", "Uy-ro'zg'or", 270000], [5, "Excel darsligi", "Kitoblar", 75000]] }, o: ["Excel darsligi", "Kitoblar", "75000", "Dazmol"], a: 0, why: "ID = 5 qator, 2-ustun — Mahsulot: Excel darsligi.", use: "Formulani yozishdan oldin natijani taxmin qilish xatoni tez topishga yordam beradi." },
          { t: "bug", code: true, q: "Diapazon A2:D6 da 4 ta ustun bor. Xatoni bosing", tokens: ["=VLOOKUP(", "F2", ",", "A2:D6", ",", "5", ",", "FALSE)"], a: 5, why: "4 ta ustunli diapazonda 5-ustun yo'q — Excel #REF! xatosini beradi.", use: "#REF! ko'rsangiz, birinchi navbatda ustun raqamini tekshiring." },
          { t: "mc", q: "Qidirilgan ID jadvalda yo'q bo'lsa, VLOOKUP (FALSE bilan) nima qaytaradi?", o: ["#N/A xatosi", "0", "Bo'sh katak", "Eng yaqin ID"], a: 0, why: "#N/A — \"topilmadi\" (not available).", use: "#N/A lar soni — ikki jadval qanchalik mos kelishini ko'rsatadi." },
          { t: "match", q: "VLOOKUP qismlarini moslang", pairs: [["F2", "Nimani qidiramiz"], ["A2:D6", "Qayerdan qidiramiz"], ["4", "Nechanchi ustundan javob olamiz"], ["FALSE", "Aniq moslik"]], use: "Bu tuzilmani bilsangiz, SQL'dagi JOIN ham oson tushuniladi." }
        ]
      },
      {
        id: "s1l5", title: "Saralash, filtr va Pivot Table", goal: "Ma'lumotni tartiblash, ajratish va yig'ma jadval",
        simple: "Saralash — sinfni bo'y bo'yicha safga tizish. Filtr — faqat 9-A sinfini chaqirish, qolganlar o'chmaydi, shunchaki ko'rinmaydi. Pivot — 'har bir sinfda nechta o'quvchi' degan qisqa jadvalni bir zumda yasash.",
        steps: [
          { t: "theory", title: "Saralash (sort) va filtr (filter)", analogy: "Saralash — sinfni bo'y bo'yicha safga tizish. Filtr — faqat 9-A sinfini chaqirish: qolganlar o'chmaydi, faqat ko'rinmay turadi.", text: "Saralash: o'sish (A→Z, kichik→katta) yoki kamayish (Z→A, katta→kichik). Filtr: faqat shartga mos qatorlarni ko'rsatadi. Excel: Data → Sort / Filter.", visual: { table: { cols: ["Mahsulot", "Narx ↓"], rows: [["Noutbuk Pro 14", "8 500 000"], ["Smartfon A12", "2 900 000"], ["Changyutgich", "1 450 000"], ["Krossovka", "520 000"]] } }, simple: "Saralash — tartiblab qo'yish. Filtr — keraksizini vaqtincha yashirish." },
          { t: "theory", title: "Pivot Table (yig'ma jadval)", analogy: "Minglab chekni bir zumda \"har bir tuman bo'yicha jami\" qilib beradigan yordamchi.", text: "Pivot'da to'rt maydon bor: Rows (qatorlar) — nima bo'yicha guruhlaymiz, Values (qiymatlar) — nimani hisoblaymiz, Columns (ustunlar) va Filters (filtrlar). Excel: Insert → PivotTable.", visual: { pivot: { raw: { cols: ["Tuman", "Summa"], rows: [["Chilonzor", 450000], ["Yunusobod", 120000], ["Chilonzor", 1300000], ["Sergeli", 85000], ["Yunusobod", 38000]] }, out: { cols: ["Tuman", "Jami"], rows: [["Chilonzor", 1750000], ["Yunusobod", 158000], ["Sergeli", 85000]] } } }, simple: "Pivot — 'har bir ... bo'yicha jami nechta/qancha' degan savolga javob beradigan qisqa jadval. Uni formulasiz, sichqoncha bilan yasaysiz." },
          { t: "mc", q: "Filtr qo'llanganda yashirilgan qatorlar bilan nima bo'ladi?", o: ["Vaqtincha ko'rinmaydi, o'chmaydi", "Butunlay o'chadi", "Boshqa faylga ko'chadi", "Raqamlari nolga aylanadi"], a: 0, why: "Filtrni olib tashlasangiz, hamma qatorlar qaytadi.", use: "Asl ma'lumotni buzmasdan kerakli qismini ko'rish — xavfsiz ish usuli." },
          { t: "order", q: "Narx bo'yicha kamayish tartibida tizing (eng qimmati birinchi)", blocks: ["Noutbuk — 8 500 000", "Smartfon — 2 900 000", "Changyutgich — 1 450 000", "Krossovka — 520 000", "Choy — 38 000"], use: "\"Top-10 mahsulot\" hisobotlari shunday saralash bilan qilinadi." },
          { t: "tf", q: "Kamayish bo'yicha saralashda (katta→kichik) eng katta qiymat birinchi chiqadi.", a: true, use: "Eng ko'p sotilgan mahsulotlarni ko'rish uchun aynan shu kerak." },
          { t: "mc", q: "Har bir tuman bo'yicha jami savdoni ko'rish uchun Pivot'da \"Tuman\" qayerga qo'yiladi?", o: ["Rows (qatorlar)", "Values (qiymatlar)", "Filters (filtr)", "Hech qayerga"], a: 0, why: "Guruhlanadigan narsa — Rows ga. Hisoblanadigan son (Summa) — Values ga.", use: "Pivot — Excel'dagi eng kuchli tahlil vositasi va intervyuda albatta so'raladi." },
          { t: "predict", q: "Pivot'da Chilonzor qatorida qanday jami chiqadi?", table: { cols: ["Tuman", "Summa"], rows: [["Chilonzor", 450000], ["Yunusobod", 120000], ["Chilonzor", 890000], ["Sergeli", 85000], ["Chilonzor", 140000]] }, o: ["1 480 000", "1 340 000", "450 000", "1 685 000"], a: 0, why: "450 000 + 890 000 + 140 000 = 1 480 000.", use: "Pivot natijasini qo'lda bir marta tekshirish — yaxshi odat." },
          { t: "match", q: "Pivot maydonini vazifasi bilan moslang", pairs: [["Rows", "Guruhlash: tuman, kategoriya"], ["Values", "Hisob: yig'indi, soni"], ["Filters", "Butun jadvalni cheklash: faqat noyabr"], ["Columns", "Ikkinchi kesim ustun bo'ylab: oylar"]], use: "To'rt maydonni bilsangiz, istalgan yig'ma hisobotni bir daqiqada qurasiz." },
          { t: "mc", q: "Faqat \"karta\" bilan to'langan buyurtmalarni ko'rish uchun nima ishlatasiz?", o: ["Filtr", "Saralash", "SUM", "Grafik"], a: 0, use: "To'lov turlari bo'yicha tahlil banklar va do'konlar uchun muhim." },
          { t: "fill", q: "Gapni to'ldiring", tpl: "Pivot Table — ___ jadval. U ma'lumotni ___.", o: ["yig'ma", "guruhlab umumlashtiradi", "o'chirib yuboradi", "rangli"], a: ["yig'ma", "guruhlab umumlashtiradi"], use: "Rahbarga \"bu Pivot nima?\" deb tushuntirish uchun shu gap yetarli." },
          { t: "tf", q: "Pivot Table asl ma'lumotni o'zgartirib yuboradi.", a: false, why: "Pivot alohida joyda yangi jadval yaratadi. Asl ma'lumot o'zgarmaydi.", use: "Shuning uchun Pivot bilan bemalol tajriba qilish mumkin." },
          { t: "case", title: "Kategoriyalar hisoboti", story: "Rahbar: \"Qaysi kategoriya eng ko'p tushum keltirdi?\" Sizda 5 000 qatorli buyurtmalar jadvali bor.", steps: [
            { q: "Pivot'ni qanday sozlaysiz?", o: ["Rows: Kategoriya, Values: Summa (Sum)", "Rows: Summa, Values: Kategoriya", "Faqat filtr qo'yaman"], a: 0, why: "Kategoriya bo'yicha guruhlab, summani qo'shamiz." },
            { q: "Natijani qanday tartiblaysiz?", o: ["Summa bo'yicha kamayish tartibida", "Alifbo bo'yicha", "Tartiblamayman"], a: 0, why: "Eng katta tushum tepada bo'lsa, javob darrov ko'rinadi." }
          ], use: "Bu — junior analitikning birinchi haftadagi tipik vazifasi." }
        ]
      },
      {
        id: "s1l6", title: "Grafiklar va Power Query", goal: "To'g'ri grafikni tanlash va Power Query bilan tanishuv",
        simple: "Vaqt bo'yicha o'zgarish — chiziq. Narsalarni solishtirish — ustunlar. Butunning bo'laklari — doira (lekin bo'lak kam bo'lsin). Ikki son orasidagi bog'liqlik — nuqtalar. Power Query — har oy bir xil tozalash ishini o'zi qiladigan konveyer.",
        steps: [
          { t: "theory", title: "To'g'ri grafikni tanlash", analogy: "Har bir asbobning o'z ishi bor: bolg'a bilan vint burab bo'lmaydi.", text: "Ustunli (bar) — toifalarni solishtirish. Chiziqli (line) — vaqt bo'yicha o'zgarish. Doiraviy (pie) — butunning ulushlari (2–5 bo'lak). Nuqtali (scatter) — ikki son orasidagi bog'liqlik.", visual: { charts: ["bar", "line", "pie", "scatter"] }, simple: "O'zingizdan so'rang: vaqtmi? — chiziq. Solishtirishmi? — ustun. Ulushmi? — doira. Ikki son bog'liqmi? — nuqtalar." },
          { t: "theory", title: "Power Query — tozalash konveyeri", analogy: "Zavod konveyeri: har oy yangi fayl kelsa, bir xil qadamlar avtomatik takrorlanadi.", text: "Power Query (Excel: Data → Get Data) — ma'lumotni yuklash va tozalash vositasi. Har bir qadam (ustunni o'chirish, bo'sh joyni tozalash, formatni to'g'rilash) Applied Steps ro'yxatida saqlanadi. Keyingi oy faqat Refresh bosasiz. Xuddi shu vosita Power BI ichida ham bor.", visual: { cycle: ["Yuklash", "Keraksiz ustunni o'chirish", "TRIM", "Sana formatini to'g'rilash", "Refresh"] }, simple: "Bir marta qo'lda tozalaysiz — Power Query qadamlarni eslab qoladi. Keyingi safar bir tugma bilan hammasini qaytaradi." },
          { t: "chart", q: "12 oy davomida tushum qanday o'zgarganini ko'rsatish kerak", o: ["line", "pie", "bar", "scatter"], a: 0, why: "Vaqt bo'yicha o'zgarish — chiziqli grafik.", use: "Oylik dinamika — har bir rahbar hisobotidagi birinchi grafik." },
          { t: "chart", q: "Toshkent tumanlari bo'yicha buyurtmalar sonini solishtirish kerak", o: ["scatter", "bar", "line", "pie"], a: 1, why: "Toifalarni solishtirish — ustunli grafik.", use: "Hududlar reytingi ustunli grafikda eng aniq ko'rinadi." },
          { t: "chart", q: "To'lov turlari ulushi: karta 65%, naqd 35%", o: ["bar", "line", "pie", "scatter"], a: 2, why: "Ikki bo'lakli butun — doiraviy grafik uchun ideal holat.", use: "Ulushlarni ko'rsatishda bo'laklar kam bo'lsa, doira yaxshi ishlaydi." },
          { t: "chart", q: "Taksi safari masofasi va narxi orasidagi bog'liqlik", o: ["pie", "bar", "line", "scatter"], a: 3, why: "Ikki son orasidagi bog'liqlik — nuqtali grafik.", use: "Narx siyosatini tekshirishda scatter grafik kerak." },
          { t: "tf", q: "Doiraviy grafikda 12 ta bo'lak bo'lsa ham o'qish oson.", a: false, why: "Ko'p bo'lakni solishtirish qiyin. Bunday holatda ustunli grafik yaxshiroq.", use: "Dashboard sharhlarida eng ko'p tanqid qilinadigan xato." },
          { t: "match", q: "Grafikni vazifasi bilan moslang", pairs: [["Chiziqli", "Vaqt bo'yicha o'zgarish"], ["Ustunli", "Toifalarni solishtirish"], ["Doiraviy", "Butunning ulushlari"], ["Nuqtali", "Ikki son orasidagi bog'liqlik"]], use: "Power BI va Tableau'da ham aynan shu qoidalar ishlaydi." },
          { t: "mc", q: "Har oy bir xil formatdagi savdo fayli keladi va siz har safar 10 ta bir xil tozalash qadamini qo'lda bajarasiz. Nima yordam beradi?", o: ["Power Query", "Doiraviy grafik", "MAX funksiyasi", "Shriftni kattalashtirish"], a: 0, why: "Power Query qadamlarni eslab qoladi va Refresh bilan takrorlaydi.", use: "Bu soatlab qo'l mehnatini bir daqiqaga qisqartiradi." },
          { t: "mc", q: "Power Query'da bajarilgan qadamlar qayerda saqlanadi?", o: ["Applied Steps (qo'llangan qadamlar) ro'yxatida", "Har bir katak ichida", "Hech qayerda", "Grafikda"], a: 0, use: "Qadamlar ro'yxati — tozalash jarayonining hujjati ham." },
          { t: "bug", q: "Hisobotdagi grafik tanlovida xato qaysi?", tokens: ["Oylik tushum → chiziqli", "Tumanlar solishtiruvi → ustunli", "Kunlik dinamika → doiraviy", "Masofa va narx → nuqtali"], a: 2, why: "Vaqt bo'yicha dinamika doiraviy grafikda ko'rinmaydi. Chiziqli kerak.", use: "Hamkasbning dashboardini sharhlaganda shunday xatolarni topasiz." },
          { t: "tf", q: "Ustunli grafikda o'q (axis) 0 dan boshlanmasa, farqlar katta ko'rinib, chalg'itishi mumkin.", a: true, why: "Masalan, 98 va 100 orasidagi farq ulkan ko'rinadi.", use: "Halol vizualizatsiya — analitikka ishonchning asosi." }
        ]
      },
      {
        id: "s1l7", title: "Boss: Onlayn do'kon hisoboti", boss: true, goal: "Mini-loyiha: SUM, AVERAGE, SUMIF, COUNTIF bilan hisobot",
        simple: "Sizda 10 ta buyurtma bor. Avval jami va o'rtachani, keyin tumanlar bo'yicha summani hisoblaysiz. Oxirida rahbarga oddiy tilda xulosa yozasiz.",
        steps: [
          { t: "theory", title: "Vazifa", analogy: "Siz \"Bozorcha\" (to'qima) onlayn do'koni analitigisiz.", text: "Rahbar so'radi: \"Noyabrda jami qancha sotdik, o'rtacha chek qancha va qaysi tuman ko'p xarid qildi?\" Natijalarni F ustuniga yozasiz.", visual: { sheet: SH_BOSS }, simple: "Jadvalda 10 ta buyurtma. D ustunida summa, E ustunida holat. Har bir savolga bitta formula yozasiz." },

  }
  const hpush = st => { try { history.pushState(st, ""); } catch (e) { /* iframe */ } };

  const closeSheet = () => document.querySelectorAll(".sheet-modal.signup").forEach(m => m.remove());

  function leaveLesson() { session = null; if (history.state && history.state.lesson) history.back(); else renderHome(); }
  function renderOnboard(step) {

  /* ---------- lesson session ---------- */
  function startLesson(id) {
    const idx = LESSONS.findIndex(x => x.l.id === id); const { l, sec } = LESSONS[idx];
    if (S.hearts <= 0) { renderNoHearts(); return; }
    const q = expand(l);
    const due = Object.entries(S.pool).filter(([k, v]) => v.due <= S.lessonsDone && EX[k] && EX[k].l.id !== l.id).slice(0, 2);
    due.forEach(([k]) => q.push(Object.assign({ id: k, review: true }, EX[k].st)));
    pyWarm(q);
    session = { kind: "lesson", l, sec, q, i: 0, total: q.filter(s => s.t !== "theory").length, firstOk: 0, wrongIds: new Set(), seen: new Set(), t0: Date.now(), xp: 0, retry: S.done[l.id] ? true : false };
    renderStep();
  }
  function startPractice(mode) {
    if (mode === "mistakes") {
      const ids = dueIds().sort((a, b) => (S.pool[a].day || "").localeCompare(S.pool[b].day || "") || S.pool[a].box - S.pool[b].box).slice(0, 8);
      if (ids.length) {
        session = { kind: "practice", l: { id: "practice", title: "Xatolar ustida ishlash", simple: "Bu yerda siz xato qilgan savollar qaytadan chiqadi. Har bir savol 3 marta to'g'ri yechilgach, ro'yxatdan chiqadi." }, sec: { color: "#2f6fdb" }, q: ids.map(k => Object.assign({ id: k, review: true }, EX[k].st, { _order: null, _draft: undefined })), i: 0, total: ids.length, firstOk: 0, wrongIds: new Set(), seen: new Set(), t0: Date.now(), xp: 0 };
        return renderStep();
      }
    }
    let ids = dueIds();
    const doneLessons = LESSONS.filter(x => isDone(x.l.id)).map(x => x.l.id);
    const extra = Object.keys(EX).filter(k => doneLessons.includes(EX[k].l.id) && !ids.includes(k));
    ids = shuffle(ids).slice(0, 6).concat(shuffle(extra)).slice(0, 6);
    if (ids.length < 3) ids = ids.concat(shuffle(Object.keys(EX).filter(k => EX[k].l.id === "s0l1" && !ids.includes(k)))).slice(0, 6);
    session = { kind: "practice", l: { id: "practice", title: "Takrorlash", simple: "Bu yerda oldingi darslardagi savollar qaytadan chiqadi. Har bir to'g'ri javob bitta jon qaytaradi." }, sec: { color: "#2f6fdb" }, q: ids.map(k => Object.assign({ id: k, review: true }, EX[k].st)), i: 0, total: ids.length, firstOk: 0, wrongIds: new Set(), seen: new Set(), t0: Date.now(), xp: 0 };
    renderStep();
  }

  const KIND = { mc: "Bitta javobni tanlang", predict: "Natijani taxmin qiling", tf: "To'g'rimi yoki noto'g'ri?", match: "Juftlarni moslang", fill: "Bo'sh joyni to'ldiring", order: "Bloklardan yig'ing", sql: "Jonli SQL", py: "Jonli Python", formula: "Jonli formula", chart: "Grafikni tanlang", bug: "Xatoni toping", theory: "Yangi mavzu" };
  let ctl = null, phase = "answer";
  function lessonShell(inner, foot) {
    const done = session.i; const pct = Math.round(done / session.q.length * 100);
    return `<div class="layer" id="layer"><div class="lbar"><button class="x" data-act="quit" aria-label="Chiqish">${I.close}</button><div class="prog"><i style="width:${pct}%"></i></div><span class="stat hp">${hpLabel()}</span></div>
      <div class="lbody" id="lbody">${inner}</div><div id="lfoot">${foot}</div></div>`;
  }
  function footAnswer() {
    const st = session.q[session.i];
    if (st.t === "theory") return `<div class="lfoot"><button class="btn ghost help" data-act="simple">Tushunmadim 🤔</button><button class="btn main" data-act="next">Davom etish</button></div>`;
    return `<div class="lfoot"><button class="btn ghost help" data-act="simple" title="Soddaroq tushuntirish">🤔</button><button class="btn main" data-act="check" id="checkbtn" ${ctl && ctl.ready() ? "" : "disabled"}>Tekshirish</button></div>`;

  function refreshCheck() { const b = document.getElementById("checkbtn"); if (b) b.disabled = !(ctl && ctl.ready()); }
  function renderStep() {
    if (session && session.i === 0) musicSync();
    document.body.classList.add("in-lesson");
    if (session.i >= session.q.length) return finish();
    const st = session.q[session.i]; phase = "answer"; ctl = null;
    let head = "";
    if (st.t !== "theory") {
      head = `<div class="kind">${session.kind === "test" ? '<span class="tag">⏩ Sinov</span>' : ""}${st.review ? '<span class="tag">🔁 Takrorlash</span>' : ""}${session.l.boss ? '<span class="tag boss">Boss</span>' : ""}${st.caseKind || st.context ? "Mini-keys" : KIND[st.t]}</div>`;

  function theoryHTML(st) {
    return `<div class="theory"><div class="kind">${session.l.boss ? '<span class="tag boss">Boss</span>' : ""}Yangi mavzu</div><h2>${esc(st.title)}</h2>
      <div class="say">${mascot("ok")}<div class="sb">${esc(st.analogy)}</div></div>
      <p class="body">${esc(st.text)}</p>${visualHTML(st.visual)}${st.example ? `<p class="ex">${esc(st.example)}</p>` : ""}</div>`;

  function ctxHTML(st) { return st.context ? `<div class="context"><span class="step">${esc(st.context.step)}</span><b>${esc(st.context.title)}</b><span>${esc(st.context.story)}</span></div>` : ""; }

  function exerciseHTML(st) {
    switch (st.t) {
      case "mc": case "predict": {
        const order = st._order || (st._order = shuffle(st.o.map((_, i) => i)));
        return `${ctxHTML(st)}<p class="q">${esc(st.q)}</p>${st.code ? `<pre class="code">${hlCode(st.code)}</pre>` : ""}${st.table ? tableHTML(st.table) : ""}<div class="opts">${order.map((oi, n) => `<button class="opt" data-o="${oi}"><span class="k">${n + 1}</span><span>${esc(st.o[oi])}</span></button>`).join("")}</div>`;
      }
      case "tf": return `<div class="statement">${esc(st.q)}</div><div class="tf"><button class="opt" data-o="1">✓ To'g'ri</button><button class="opt" data-o="0">✗ Noto'g'ri</button></div>`;
      case "match": {
        const L = shuffle(st.pairs.map((p, i) => i)), R = shuffle(st.pairs.map((p, i) => i));
        return `<p class="q">${esc(st.q)}</p><div class="match"><div class="col">${L.map(i => `<button class="opt" data-l="${i}">${esc(st.pairs[i][0])}</button>`).join("")}</div><div class="col">${R.map(i => `<button class="opt" data-r="${i}">${esc(st.pairs[i][1])}</button>`).join("")}</div></div>`;

        return `<p class="q">${esc(st.q)}</p><div class="slots ${st.code ? "mono" : ""}">${tpl}</div><div class="bank">${shuffle(st.o.map((o, i) => i)).map(i => `<button class="blk ${st.code ? "mono" : ""}" data-chip="${i}">${esc(st.o[i])}</button>`).join("")}</div>`;
      }
      case "order": {
        const all = st.blocks.concat(st.extra || []);
        return `<p class="q">${esc(st.q)}</p><div class="answer-line ${st.code ? "" : "lines"}" id="ansline"></div><div class="bank">${shuffle(all.map((b, i) => i)).map(i => `<button class="blk ${st.code ? "mono" : ""}" data-blk="${i}">${esc(all[i])}</button>`).join("")}</div>`;
      }
      case "bug": return `<p class="q">${esc(st.q)}</p><div class="bugline ${st.code ? "mono" : ""}">${st.tokens.map((t, i) => `<button class="blk ${st.code ? "mono" : ""}" data-tok="${i}">${esc(t)}</button>`).join("")}</div>`;
      case "chart": {
        const order = st._order || (st._order = shuffle(st.o.map((_, i) => i)));
        return `<p class="q">${esc(st.q)}</p><div class="chartopts">${order.map(oi => `<button class="opt" data-o="${oi}">${miniChart(st.o[oi])}<span>${CHART_LABEL[st.o[oi]]}</span></button>`).join("")}</div>`;
      }
      case "sql": return `<p class="q">${esc(st.task)}</p>
        <div class="schema">${st.tables.map(t => `<button data-peek="${t}">${I.db.replace("<svg", '<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:4px"')}${t}</button>`).join("")}<button data-peek="__all">barcha jadvallar</button><div class="cols" id="schemacols">${st.tables.map(t => `${t}(${DATA[t].cols.join(", ")})`).join("<br>")}</div></div>
        <textarea class="editor" id="sqled" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SQL so'rov">${esc(st._draft ?? st.starter ?? "")}</textarea>
        <div class="row"><button class="btn sky sm" data-act="run">▶ Ishga tushirish</button><span class="loading" id="sqlstat"></span></div><div class="out" id="sqlout"></div>`;
      case "py": return `<p class="q">${esc(st.task)}</p>
        ${st.tables ? `<div class="schema">${st.tables.map(t => `<button data-peek="${t}">${I.db.replace("<svg", '<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:4px"')}${t}.csv</button>`).join("")}<div class="cols" id="schemacols">${st.tables.map(t => `${t}.csv: ${DATA[t].cols.join(", ")}`).join("<br>")}</div></div>` : ""}
        <textarea class="editor py" id="pyed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Python kod">${esc(st._draft ?? st.starter ?? "")}</textarea>
        <div class="row"><button class="btn sky sm" data-act="pyrun">▶ Ishga tushirish</button><span class="loading" id="pystat"></span></div><div class="out" id="pyout"></div>`;
      case "formula": return `<p class="q">${esc(st.task)}</p><div id="fsheet">${sheetHTML(st.sheet, { target: st.target })}</div>
        <div class="fxinput"><span class="cell">${st.target}</span><em>fx</em><input id="fxin" value="${esc(st._draft ?? "=")}" spellcheck="false" autocapitalize="characters" autocomplete="off" aria-label="Formula"></div>
        <div class="fxhelp">${(st.keys || ["=", "SUM(", "AVERAGE(", "COUNT(", "MIN(", "MAX(", "IF(", "COUNTIF(", "SUMIF(", "VLOOKUP(", "XLOOKUP(", ":", ",", "\"", ")", "*", "/", "+", ">="]).map(k => `<button data-ins="${esc(k)}">${esc(k)}</button>`).join("")}</div>
        <div class="preview" id="fxprev">Natija shu yerda ko'rinadi.</div>`;
    }
    return "";
  }

  function bindExercise(st) {
    const body = document.getElementById("lbody");
    const c = { ready: () => false, check: () => ({ ok: false }), answer: "" };
    if (["mc", "predict", "tf", "chart"].includes(st.t)) {
      let sel = null;
      body.querySelectorAll(".opt[data-o]").forEach(b => b.onclick = () => { if (phase !== "answer") return; body.querySelectorAll(".opt[data-o]").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.o; refreshCheck(); });
      c.ready = () => sel !== null;
      if (st.t === "tf") { c.check = () => ({ ok: (sel === 1) === st.a }); c.answer = st.a ? "To'g'ri" : "Noto'g'ri"; }
      else { c.check = () => ({ ok: sel === st.a }); c.answer = st.t === "chart" ? CHART_LABEL[st.o[st.a]] + " grafik" : st.o[st.a]; }
      c.key = n => { const btns = body.querySelectorAll(".opt[data-o]"); if (btns[n - 1]) btns[n - 1].click(); };
    }
    if (st.t === "match") {
      let L = null, R = null, matched = 0, wrong = 0;
      const tryPair = () => {
        if (L === null || R === null) return;
        const lb = body.querySelector(`[data-l="${L}"]`), rb = body.querySelector(`[data-r="${R}"]`);
        if (L === R) { [lb, rb].forEach(b => { b.classList.remove("sel"); b.classList.add("ok"); b.disabled = true; }); matched++; sfx("pair", matched); }
        else { wrong++; [lb, rb].forEach(b => { b.classList.remove("sel"); b.classList.add("no"); setTimeout(() => b.classList.remove("no"), 400); }); sfx("bad"); }
        L = R = null;
        if (matched === st.pairs.length) setTimeout(() => submit(), 250);
      };
      body.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { body.querySelectorAll("[data-l]").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); L = +b.dataset.l; tryPair(); });
      body.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { body.querySelectorAll("[data-r]").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); R = +b.dataset.r; tryPair(); });
      c.ready = () => false; c.check = () => ({ ok: wrong < 2, msg: wrong >= 2 ? `${wrong} marta noto'g'ri juft tanlandi.` : "" });
      c.answer = st.pairs.map(p => p[0] + " — " + p[1]).join("; ");
    }
    if (st.t === "fill") {
      const slots = [...body.querySelectorAll("[data-slot]")]; const fill = slots.map(() => null);
      const paint = () => { slots.forEach((s, i) => { s.className = "slot" + (fill[i] !== null ? " f" : ""); s.textContent = fill[i] !== null ? st.o[fill[i]] : ""; }); body.querySelectorAll("[data-chip]").forEach(b => b.classList.toggle("used", fill.includes(+b.dataset.chip))); refreshCheck(); };
      body.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => { if (phase !== "answer") return; const k = fill.indexOf(null); if (k < 0) return; fill[k] = +b.dataset.chip; paint(); });
      slots.forEach((s, i) => s.onclick = () => { if (phase !== "answer") return; fill[i] = null; paint(); });
      c.ready = () => !fill.includes(null);
      c.check = () => ({ ok: fill.every((f, i) => st.o[f] === st.a[i]) });
      c.answer = st.tpl.split("___").reduce((a, p, i) => a + p + (st.a[i] ?? ""), "");
    }
    if (st.t === "order") {
      const all = st.blocks.concat(st.extra || []); const seq = []; const line = document.getElementById("ansline");

  function confetti() {

    const cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv);
    const ctx = cv.getContext("2d"); const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cols = ["#1f9d55", "#f5a400", "#2f6fdb", "#e5484d", "#7c5cff", "#0e9384"];
    const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(cols) }));

  document.addEventListener("keydown", e => {
    if (!session || document.querySelector(".sheet-modal")) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (e.key === "Enter" && tag !== "textarea") {
      e.preventDefault();
      if (phase === "answer") { const st = session.q[session.i]; if (st.t === "theory") next(); else if (ctl && ctl.ready()) submit(); }
      else if (phase === "result") next();
      else if (phase === "soft") document.querySelector('[data-act="fix"]').click();
    } else if (/^[1-4]$/.test(e.key) && tag !== "textarea" && tag !== "input" && phase === "answer" && ctl && ctl.key) ctl.key(+e.key);
  });

  addEventListener("popstate", e => {
    const st = e.state || {};
    if (st.lesson && !session) { history.back(); return; }
    session = null; tab = st.tab || "home"; openLesson = null; modal = null; renderHome(); window.scrollTo(0, 0);
  });
  load();
  if (S.photo && !S.photoSm) thumbOf(S.photo).then(t => { S.photoSm = t; save(); });
  try { history.replaceState({ tab: "home" }, ""); } catch (e) { /* iframe */ }
  if (!S.onboarded) renderOnboard(1); else renderHome();
  window.DY_APP = { state: () => S, startLesson, cur: () => session && session.q[session.i], version: "1.3", musicOn: () => !!mTimer && !mOff,
    gift, quests: () => quests(),
    replaceState(ns) { S = Object.assign(fresh(), ns); rollDay(); save(); if (!session) renderHome(); },
    refresh() {
      if (pendingStart && window.DY_CLOUD && window.DY_CLOUD.user()) { const id = pendingStart; pendingStart = null; closeSheet(); beginLesson(id); return; }
      if (!session && S.onboarded) renderHome();
    } };
  if (window.DY_CLOUD) window.DY_CLOUD.start();
})();

</script>
